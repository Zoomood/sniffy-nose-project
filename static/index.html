<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{meta.title}}</title>
  <script>try { const t = localStorage.getItem("sniffy-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <meta name="description" content="{{meta.description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v={{version}}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'><path d='M8 2h8l2 4-2 4H8L6 6z' fill='%23dfe7f1' stroke='%23141414'/><rect x='9' y='10' width='6' height='3' fill='%23b08d57'/><path d='M4 13h16l2 2v14l-2 2H4l-2-2V15z' fill='%23dfe7f1' stroke='%23141414'/><rect x='4' y='20' width='16' height='10' fill='%23f0a23b'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">{{meta.logo}}</a>
    <nav>
      <a href="#/" data-nav="home">{{nav.home}}</a>
      <a href="#/dictionary" data-nav="dictionary">{{nav.dictionary}}</a>
      <a href="#/glossary" data-nav="glossary">{{nav.glossary}}</a>
      <a href="#/history" data-nav="history">{{nav.history}}</a>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="tooltip" role="tooltip" hidden></div>

  <footer class="footer">
    {{meta.footer}}
  </footer>

  <script src="app.js?v={{version}}"></script>
</body>
</html>
